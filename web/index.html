<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자 야구 - 테스트 클라이언트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: #e8e8f0; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }

  /* 상태 */
  .status { padding: 12px 16px; background: #111128; border-radius: 10px; border: 1px solid #2a2a5a; text-align: center; font-size: 14px; }
  .status.connected { border-color: #00b894; }
  .status.playing { border-color: #6c5ce7; }
  .status.win { border-color: #fdcb6e; background: #1a1a3e; }
  .status.lose { border-color: #e17055; }

  /* 접속 */
  .connect-box { display: flex; gap: 8px; }
  .connect-box input { flex: 1; padding: 10px 14px; background: #111128; border: 1px solid #2a2a5a; border-radius: 8px; color: #e8e8f0; font-size: 14px; outline: none; }
  .connect-box input:focus { border-color: #6c5ce7; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: #6c5ce7; color: white; }
  .btn-primary:hover { background: #5a4bd6; }
  .btn-primary:disabled { background: #2a2a5a; color: #555; cursor: not-allowed; }

  /* 입력 */
  .guess-box { display: flex; gap: 8px; align-items: center; }
  .digit-inputs { display: flex; gap: 6px; }
  .digit-input { width: 48px; height: 48px; text-align: center; font-size: 22px; font-weight: bold; background: #1a1a3e; border: 2px solid #2a2a5a; border-radius: 10px; color: #e8e8f0; outline: none; }
  .digit-input:focus { border-color: #6c5ce7; }
  .digit-input.filled { border-color: #a29bfe; }

  /* 로그 */
  .log { flex: 1; background: #111128; border-radius: 10px; border: 1px solid #2a2a5a; padding: 12px; overflow-y: auto; max-height: 340px; display: flex; flex-direction: column; gap: 4px; }
  .log-entry { font-size: 13px; padding: 6px 10px; border-radius: 6px; line-height: 1.5; }
  .log-entry.mine { background: rgba(108,92,231,0.15); }
  .log-entry.opponent { background: rgba(255,255,255,0.05); }
  .log-entry.system { color: #8888aa; font-size: 12px; }
  .log-entry.result { font-size: 15px; font-weight: bold; text-align: center; padding: 10px; }

  /* 턴 표시 */
  .turn-indicator { text-align: center; font-size: 13px; color: #a29bfe; padding: 6px; }
  .turn-indicator.my-turn { color: #00b894; font-weight: bold; }

  /* 랭킹 */
  .ranking-btn { background: none; border: 1px solid #2a2a5a; color: #8888aa; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .ranking-btn:hover { border-color: #6c5ce7; color: #e8e8f0; }
</style>
</head>
<body>

<h1>⚾ 숫자 야구</h1>

<div class="container">
  <div class="status" id="status">연결 대기 중</div>

  <div class="connect-box" id="connectBox">
    <input type="text" id="userId" placeholder="닉네임 입력" />
    <button class="btn btn-primary" id="connectBtn" onclick="connect()">접속</button>
  </div>

  <div class="turn-indicator" id="turnIndicator" style="display:none;"></div>

  <div class="guess-box" id="secretBox" style="display:none;">
    <div class="digit-inputs" id="secretInputs"></div>
    <button class="btn btn-primary" id="secretBtn" onclick="submitSecret()">비밀 숫자 설정</button>
  </div>

  <div class="guess-box" id="guessBox" style="display:none;">
    <div class="digit-inputs" id="digitInputs"></div>
    <button class="btn btn-primary" id="guessBtn" onclick="submitGuess()" disabled>제출</button>
  </div>

  <div class="log" id="log"></div>

  <button class="ranking-btn" onclick="fetchRanking()">🏆 랭킹 보기</button>
</div>

<script>
const WS_URL = 'ws://localhost:8082/ws';
const API_URL = 'http://localhost:8082/api';
let ws = null;
let myTurn = false;
let digits = 3;
let userId = '';

const $ = id => document.getElementById(id);

function connect() {
  userId = $('userId').value.trim();
  if (!userId) return;

  setStatus('연결 중...', '');
  $('connectBtn').disabled = true;

  ws = new WebSocket(`${WS_URL}?user_id=${encodeURIComponent(userId)}`);

  ws.onopen = () => {
    setStatus('매칭 대기 중...', 'connected');
    $('connectBox').style.display = 'none';
    addLog('서버에 연결되었습니다. 상대를 기다리는 중...', 'system');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    setStatus('연결 끊김', '');
    addLog('서버와 연결이 끊어졌습니다.', 'system');
    $('connectBox').style.display = 'flex';
    $('connectBtn').disabled = false;
    $('guessBox').style.display = 'none';
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'set_secret':
      digits = msg.payload.config.digits || 3;
      setStatus(`매칭 완료! 비밀 숫자를 설정하세요 (${digits}자리)`, 'playing');
      addLog(`🎮 매칭 완료! ${digits}자리 비밀 숫자를 설정하세요`, 'system');
      buildSecretInputs();
      $('secretBox').style.display = 'flex';
      break;

    case 'game_start':
      digits = msg.payload.config.digits || 3;
      setStatus(`게임 시작! (${digits}자리)`, 'playing');
      addLog('✅ 양쪽 모두 설정 완료! 게임 시작', 'system');
      $('secretBox').style.display = 'none';
      buildDigitInputs();
      $('guessBox').style.display = 'flex';
      break;

    case 'your_turn':
      myTurn = true;
      setTurn(`🟢 내 턴 (Turn ${msg.payload.turn})`);
      $('guessBtn').disabled = false;
      focusFirstInput();
      break;

    case 'wait_turn':
      myTurn = false;
      setTurn('⏳ 상대 턴...');
      $('guessBtn').disabled = true;
      break;

    case 'guess_result':
      addLog(`내 추측: ${msg.payload.guess} → ${formatResult(msg.payload)}`, 'mine');
      clearInputs();
      break;

    case 'opponent_guess':
      addLog(`상대 추측: ${msg.payload.guess} → ${formatResult(msg.payload)}`, 'opponent');
      break;

    case 'game_over': {
      const p = msg.payload;
      const isWin = p.winner === userId;
      $('guessBox').style.display = 'none';
      $('turnIndicator').style.display = 'none';

      if (isWin) {
        setStatus('🎉 승리!', 'win');
        addLog(`🎉 승리! (${p.turns}턴, ${p.reason})`, 'result');
      } else {
        setStatus('😢 패배', 'lose');
        addLog(`😢 패배 (${p.turns}턴, ${p.reason})`, 'result');
      }

      // 재매칭 버튼
      setTimeout(() => {
        $('connectBox').style.display = 'flex';
        $('connectBox').innerHTML = `<button class="btn btn-primary" style="width:100%" onclick="reconnect()">다시 매칭</button>`;
      }, 1500);
      break;
    }

    case 'reconnected':
      setStatus('재접속 완료!', 'playing');
      addLog(`🔄 재접속 성공 (Turn ${msg.payload.turn})`, 'system');
      $('guessBox').style.display = 'flex';
      if (msg.payload.your_turn) {
        myTurn = true;
        setTurn('🟢 내 턴');
        $('guessBtn').disabled = false;
      } else {
        setTurn('⏳ 상대 턴...');
      }
      break;
  }
}

function submitGuess() {
  if (!myTurn) return;
  const inputs = document.querySelectorAll('.digit-input');
  let guess = '';
  for (const inp of inputs) {
    if (!inp.value) return;
    guess += inp.value;
  }

  // 중복 체크
  if (new Set(guess).size !== digits) {
    addLog('⚠️ 중복된 숫자는 안 됩니다!', 'system');
    return;
  }

  ws.send(JSON.stringify({ type: 'guess', payload: { guess } }));
  myTurn = false;
  $('guessBtn').disabled = true;
}

function reconnect() {
  $('connectBox').innerHTML = `
    <input type="text" id="userId" value="${userId}" />
    <button class="btn btn-primary" id="connectBtn" onclick="connect()">접속</button>
  `;
  connect();
}

function buildSecretInputs() {
  const container = $('secretInputs');
  container.innerHTML = '';
  for (let i = 0; i < digits; i++) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.className = 'digit-input';
    inp.inputMode = 'numeric';
    inp.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value) {
        e.target.classList.add('filled');
        const next = e.target.nextElementSibling;
        if (next) next.focus();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value) {
        e.target.classList.remove('filled');
        const prev = e.target.previousElementSibling;
        if (prev) prev.focus();
      }
      if (e.key === 'Enter') submitSecret();
    });
    container.appendChild(inp);
  }
  container.querySelector('input').focus();
}

function submitSecret() {
  const inputs = $('secretInputs').querySelectorAll('.digit-input');
  let secret = '';
  for (const inp of inputs) {
    if (!inp.value) return;
    secret += inp.value;
  }
  if (new Set(secret).size !== digits) {
    addLog('⚠️ 중복된 숫자는 안 됩니다!', 'system');
    return;
  }
  ws.send(JSON.stringify({ type: 'set_secret', payload: { guess: secret } }));
  $('secretBox').style.display = 'none';
  setStatus('상대방 설정 대기 중...', 'playing');
  addLog(`🔒 비밀 숫자 설정 완료! 상대를 기다리는 중...`, 'system');
}

function buildDigitInputs() {
  const container = $('digitInputs');
  container.innerHTML = '';
  for (let i = 0; i < digits; i++) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.className = 'digit-input';
    inp.inputMode = 'numeric';
    inp.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value) {
        e.target.classList.add('filled');
        const next = e.target.nextElementSibling;
        if (next) next.focus();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value) {
        e.target.classList.remove('filled');
        const prev = e.target.previousElementSibling;
        if (prev) prev.focus();
      }
      if (e.key === 'Enter') submitGuess();
    });
    container.appendChild(inp);
  }
}

function clearInputs() {
  document.querySelectorAll('.digit-input').forEach(inp => {
    inp.value = '';
    inp.classList.remove('filled');
  });
}

function focusFirstInput() {
  const first = document.querySelector('.digit-input');
  if (first) first.focus();
}

function formatResult(r) {
  return `${r.strike}S ${r.ball}B ${r.out}O`;
}

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

function setTurn(text) {
  const el = $('turnIndicator');
  el.style.display = 'block';
  el.textContent = text;
  el.className = 'turn-indicator' + (myTurn ? ' my-turn' : '');
}

function addLog(text, cls) {
  const el = $('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + (cls || '');
  entry.textContent = text;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}

async function fetchRanking() {
  try {
    const res = await fetch(`${API_URL}/ranking?limit=10`);
    const data = await res.json();
    if (!data.ranking || data.ranking.length === 0) {
      addLog('🏆 랭킹: 아직 기록이 없습니다', 'system');
      return;
    }
    addLog('── 🏆 랭킹 Top 10 ──', 'system');
    data.ranking.forEach(r => {
      addLog(`  #${r.rank} ${r.user_id} (${r.score}점)`, 'system');
    });
  } catch {
    addLog('랭킹 조회 실패 (서버 확인)', 'system');
  }
}
</script>
</body>
</html>
