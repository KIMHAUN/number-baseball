version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: number_baseball
    ports:
      - "3307:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  game-server:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_DSN: "root:root@tcp(mysql:3306)/number_baseball?parseTime=true"
      REDIS_ADDR: "redis:6379"
      PORT: "8082"
    depends_on:
      mysql:
        condition: service_healthy
